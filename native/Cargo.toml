[workspace]
members = [
    "mjolnir_protocol",
    "mjolnir_api",
    "mjolnir_guest_agent",
    "mjolnir_client",
    "mjolnir_gateway",
    "mjolnir_blob_door",
    "mjolnir_aie_sidecar",
    "mjolnir_biscuit",
]
resolver = "2"

# This optional guest executable requires pinned sibling source checkouts.
# Its standalone workspace must not block core host/agent/gateway builds.
exclude = ["mjolnir_lan_files"]
