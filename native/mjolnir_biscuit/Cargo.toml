[package]
name = "mjolnir-biscuit"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["World Tree Network Foundation"]
description = "Host Biscuit mint/verify face the BEAM calls"
repository = "https://github.com/Identikey/mjolnir"
publish = false

[[bin]]
name = "mjolnir-biscuit"
path = "src/bin/mjolnir-biscuit.rs"

[dependencies]
base64 = "0.22"
hex = "0.4"
identikey-capability = "0.1.0"
identikey-auth = "=0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"


