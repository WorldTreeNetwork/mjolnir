[package]
name = "mjolnir-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
mjolnir-protocol = { path = "../mjolnir_protocol" }
iroh = "0.96"
iroh-base = "0.96"
z32 = "1.3"
dashmap = "6"
tokio = { version = "1", features = ["full", "signal"] }
tokio-rustls = "0.26"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "tls12", "ring"] }
rustls-pemfile = "2"
arc-swap = "1"
x509-parser = "0.16"
sha2 = "0.10"
hex = "0.4"
humantime = "2"
instant-acme = "0.7"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rcgen = "0.13"

[dev-dependencies]
rand = "0.9"
tempfile = "3"
tracing-test = "0.2"
mockito = "1"
thiserror = "2"

[lib]
name = "mjolnir_gateway"
path = "src/lib.rs"

[[bin]]
name = "mjolnir-gateway"
path = "src/main.rs"
