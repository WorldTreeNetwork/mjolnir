[package]
name = "mjolnir-aie-sidecar"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["World Tree Network Foundation"]
description = "Mjolnir host AIE compute sidecar"
repository = "https://github.com/Identikey/mjolnir"
publish = false

[[bin]]
name = "mjolnir-aie"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
libc = "0.2"
nix = { version = "0.29", features = ["fs", "process", "signal", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
