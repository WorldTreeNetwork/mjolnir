[package]
name = "mjolnir-api"
version = "0.1.0"
edition = "2021"
description = "Shared Mjolnir host-API data layer + OIDC token store, consumed by the mjolnir CLI and external apps (Papyrus)."

[dependencies]
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Parse the CLI's profiles.toml to inherit the configured host API base.
toml = "0.8"
# rustls (not native-tls) so downstream GUI consumers (Papyrus) stay on the
# rustls stack and don't drag in openssl. The CLI bin enables native-tls
# separately; cargo feature-unifies both backends in the workspace build.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
dirs = "6"
open = "5"
sha2 = "0.10"
rand = "0.8"
