[package]
name = "mjolnir-client"
version = "0.1.0"
edition = "2021"

[dependencies]
mjolnir-protocol = { path = "../mjolnir_protocol" }
mjolnir-api = { path = "../mjolnir_api" }
iroh = "1.0"
tokio = { version = "1", features = ["full", "signal"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
toml = "0.8"
rmcp = { version = "1", features = ["server", "transport-io"] }
schemars = "1"
hex = "0.4"
z32 = "1.3"
scopeguard = "1"
dirs = "6"
open = "5"
sha2 = "0.10"
rand = "0.8"
# Sites publish: ED25519 signing, HKDF-SHA256, base64 envelope fields, and
# second-precision UTC timestamps. XChaCha20 and base58 are implemented in
# `sites.rs` because they must match the Elixir side byte-for-byte (notably
# base58, which drops leading zeros unlike `bs58`).
ed25519-dalek = "3.0.0-rc.0"
hmac = "0.12"
base64 = "0.22"
chrono = "0.4"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
similar = "2"
# Deploy: gitignore-aware walk + gzipped tar of the app source tree.
ignore = "0.4"
tar = "0.4"
flate2 = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["term", "signal"] }
libc = "0.2"

[[bin]]
name = "mjolnir"
path = "src/main.rs"
