[package]
name = "mjolnir-client"
version = "0.1.0"
edition = "2021"

[dependencies]
mjolnir-protocol = { path = "../mjolnir_protocol" }
iroh = "0.96"
iroh-base = "0.96"
tokio = { version = "1", features = ["full", "signal"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
toml = "0.8"
rmcp = { version = "1", features = ["server", "transport-io"] }
schemars = "1"
hex = "0.4"
z32 = "1.3"
scopeguard = "1"
dirs = "6"
open = "5"
sha2 = "0.10"
rand = "0.8"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["term", "signal"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
crossterm = "0.28"

[[bin]]
name = "mjolnir"
path = "src/main.rs"
