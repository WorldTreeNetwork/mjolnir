[package]
name = "mjolnir-guest-agent"
version = "0.1.0"
edition = "2021"

# Feature flags:
# - `full` (default): enables the full guest agent with tmux, secrets, agent SDK, and Iroh.
# - `iroh`: enables the Iroh P2P endpoint for NAT-traversing shell access.
#   When disabled (the default), the agent runs in vsock-only mode with zero
#   Iroh code compiled in.  Enable with: cargo build --features iroh
# - `boot`: minimal boot agent — only vsock/pty/protocol. No tmux, secrets, or agent SDK.
#   Boot = absence of full. Build with: cargo build --bin mjolnir-boot-agent --no-default-features --features boot
[features]
default = ["full"]
full = ["dep:once_cell", "dep:strip-ansi-escapes", "dep:anyhow", "dep:zeroize"]
iroh = ["dep:iroh", "dep:futures-lite", "dep:rand"]
boot = []

[dependencies]
mjolnir-protocol = { path = "../mjolnir_protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full", "signal"] }
tokio-vsock = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.0", features = ["v4"] }

# Phase 2: Iroh shell (optional — enabled by the `iroh` feature flag)
iroh = { version = "1.0", optional = true }
futures-lite = { version = "2", optional = true }
nix = { version = "0.29", features = ["term", "signal", "process", "fs"] }
rand = { version = "0.9", optional = true }
libc = "0.2"
# Heavy deps — only needed by the full agent (tmux, secrets, agent SDK)
once_cell = { version = "1", optional = true }
strip-ansi-escapes = { version = "0.2", optional = true }
anyhow = { version = "1", optional = true }
zeroize = { version = "1", features = ["derive"], optional = true }

[[bin]]
name = "mjolnir-agent"
path = "src/main.rs"
required-features = ["full"]

[[bin]]
name = "mjolnir-boot-agent"
path = "src/boot_main.rs"
