[package]
name = "mjolnir-guest-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
mjolnir-protocol = { path = "../mjolnir_protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full", "signal"] }
tokio-vsock = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

# Phase 2: Iroh shell
iroh = "0.96"
futures-lite = "2"
nix = { version = "0.29", features = ["term", "signal", "process", "fs"] }
rand = "0.9"
libc = "0.2"

[[bin]]
name = "mjolnir-agent"
path = "src/main.rs"
