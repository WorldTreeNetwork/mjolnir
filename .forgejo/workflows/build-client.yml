name: Build mj client

# Builds the `mj` binary in a Mjolnir microVM — Mjolnir building its own client.
# The runner label `ubuntu-24.04` maps to `mjolnir:ci-ubuntu-24.04`, our base
# image, which carries rust + zig via mise (see scripts/lib/mise.sh).

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.forgejo/workflows/build-client.yml'
  pull_request:
    paths:
      - 'native/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Fail loudly and early if the image regressed. A missing toolchain
      # otherwise surfaces ten minutes later as an inscrutable cargo error.
      - name: Toolchain provenance
        run: |
          pwd
          cargo --version
          rustc --version
          echo "mise: $(mise --version)"

      # DIAGNOSTIC (mjolnir-7c4): the Mjolnir VM executor ignored
      # `working-directory` on run 1 — cargo ran in the repo root instead of
      # native/. Every step below therefore cds explicitly. This step reports
      # whether the key is honoured; when it prints a path ending in /native,
      # the explicit cds can go.
      - name: Does working-directory work yet?
        working-directory: native
        continue-on-error: true
        run: echo "working-directory landed in: $(pwd)"

      # Scoped to the client on purpose: the workspace also holds
      # mjolnir_guest_agent, whose tokio-vsock dependency and musl target
      # belong to the deploy path, not here.
      - name: Test protocol + client
        run: cd native && cargo test -p mjolnir-protocol -p mjolnir-client

      - name: Build release
        run: cd native && cargo build --release -p mjolnir-client

      - name: Verify the binary runs
        run: |
          cd native
          ./target/release/mjolnir --version
          ./target/release/mjolnir --help > /dev/null
          sha256sum target/release/mjolnir
