name: Build mj client

# Builds the `mj` binary in a Mjolnir microVM — Mjolnir building its own client
# — and publishes it as a downloadable artifact.
#
# The runner label `ubuntu-24.04` maps to `mjolnir:ci-ubuntu-24.04`, our base
# image, which carries rust + zig via mise (see scripts/lib/mise.sh). Because
# nothing caches between VMs yet (mjolnir-5xn), expect ~10 minutes cold.

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.forgejo/workflows/build-client.yml'
  pull_request:
    paths:
      - 'native/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Fail loudly and early if the image regressed. A missing toolchain
      # otherwise surfaces ten minutes later as an inscrutable cargo error.
      - name: Toolchain provenance
        run: |
          cargo --version
          rustc --version
          echo "mise: $(mise --version)"

      # Scoped to the client on purpose: the workspace also holds
      # mjolnir_guest_agent, whose tokio-vsock dependency and musl target
      # belong to the deploy path, not here.
      - name: Test protocol + client
        working-directory: native
        run: cargo test -p mjolnir-protocol -p mjolnir-client

      - name: Build release
        working-directory: native
        run: cargo build --release -p mjolnir-client

      - name: Verify the binary runs
        working-directory: native
        run: |
          ./target/release/mjolnir --version
          ./target/release/mjolnir --help > /dev/null
          sha256sum target/release/mjolnir

      # forgejo/, not actions/. The upstream action bundles @actions/artifact
      # v2, which refuses to talk to any host that is not github.com — Forgejo
      # reads as GHES and it fails with GHESNotSupportedError before making a
      # request. That check is client-side, so no server-side fix reaches it.
      - name: Publish mj
        uses: forgejo/upload-artifact@v4
        with:
          name: mj-x86_64-linux
          path: native/target/release/mjolnir
          if-no-files-found: error
          # Quoted strings, not YAML booleans, and passed explicitly rather
          # than relying on the action's defaults. Both habits are cheap
          # insurance around act's input handling.
          include-hidden-files: 'false'
          overwrite: 'true'
