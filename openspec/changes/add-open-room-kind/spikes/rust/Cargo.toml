[workspace]

[package]
name = "open-room-kind-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Spike H1 for add-open-room-kind. Not product code. Pins match native/mjolnir_relay:
# moq 4a6f52248, iroh-live 747b1bd. Cargo.lock starts as a copy of the relay's.
[dependencies]
anyhow = "1"
bs58 = "0.5"
hex = "0.4"
iroh = { version = "1.4.1", default-features = false, features = ["tls-aws-lc-rs"] }
kio = { git = "https://github.com/moq-dev/moq", rev = "4a6f52248", features = ["manual"] }
mjolnir-relay = { path = "../../../../../native/mjolnir_relay" }
moq-auth = { git = "https://github.com/moq-dev/moq", rev = "4a6f52248", default-features = false }
moq-relay = { git = "https://github.com/moq-dev/moq", rev = "4a6f52248", default-features = false }
moq-tokio = { git = "https://github.com/moq-dev/moq", rev = "4a6f52248", default-features = false }
moq-transport-iroh = { git = "https://github.com/n0-computer/iroh-live", rev = "747b1bd" }
rcgen = "0.13"
sha2 = "0.10"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
