# Mjolnir Redis sidecar. Installed to /etc/mjolnir/redis.conf.
# requirepass is appended by scripts/install-redis.sh — never commit it.
# Never bind 0.0.0.0.

bind 10.200.0.1
port 6379
protected-mode yes
daemonize no
supervised systemd
pidfile /run/mjolnir-redis/redis.pid
logfile ""
loglevel notice

dir /var/lib/mjolnir/redis
appendonly yes
appendfsync everysec
appenddirname appendonlydir
databases 1

unixsocket /run/mjolnir-redis/redis.sock
unixsocketperm 660

rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
rename-command MODULE ""
rename-command REPLICAOF ""
rename-command SLAVEOF ""
