name: 'Publish Package'
description: 'Upload a build artifact to the Forgejo generic package registry'
inputs:
  file:
    description: 'Path to the file to publish'
    required: true
  name:
    description: 'Package name (defaults to repo name)'
    required: false
  version:
    description: 'Package version (defaults to git SHA short)'
    required: false
  filename:
    description: 'Filename in the registry (defaults to basename of file)'
    required: false
  token:
    description: 'Forgejo API token (defaults to GITHUB_TOKEN/FORGEJO_TOKEN)'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Publish package
      shell: bash
      run: |
        set -euo pipefail

        FILE="${{ inputs.file }}"
        if [ ! -f "$FILE" ]; then
          echo "::error::File not found: $FILE"
          exit 1
        fi

        # Resolve defaults
        PKG_NAME="${{ inputs.name }}"
        if [ -z "$PKG_NAME" ]; then
          PKG_NAME="${FORGEJO_REPOSITORY##*/}"
          PKG_NAME="${PKG_NAME:-${GITHUB_REPOSITORY##*/}}"
        fi

        VERSION="${{ inputs.version }}"
        if [ -z "$VERSION" ]; then
          SHA="${FORGEJO_SHA:-${GITHUB_SHA:-$(git rev-parse HEAD)}}"
          VERSION="${SHA:0:8}"
        fi

        FILENAME="${{ inputs.filename }}"
        if [ -z "$FILENAME" ]; then
          FILENAME="$(basename "$FILE")"
        fi

        TOKEN="${{ inputs.token }}"
        if [ -z "$TOKEN" ]; then
          TOKEN="${FORGEJO_TOKEN:-${GITHUB_TOKEN:-}}"
        fi

        if [ -z "$TOKEN" ]; then
          echo "::error::No token provided and FORGEJO_TOKEN/GITHUB_TOKEN not set"
          exit 1
        fi

        SERVER="${FORGEJO_SERVER_URL:-${GITHUB_SERVER_URL:-http://127.0.0.1:3000}}"
        OWNER="${FORGEJO_REPOSITORY_OWNER:-${GITHUB_REPOSITORY_OWNER:-}}"

        URL="${SERVER}/api/packages/${OWNER}/generic/${PKG_NAME}/${VERSION}/${FILENAME}"

        echo "Publishing: ${PKG_NAME}/${VERSION}/${FILENAME}"
        echo "  File: $FILE ($(stat -c%s "$FILE" 2>/dev/null || stat -f%z "$FILE") bytes)"
        echo "  URL:  $URL"

        HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/publish-response.txt \
          --upload-file "$FILE" \
          -H "Authorization: token $TOKEN" \
          "$URL")

        if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
          echo "Published successfully (HTTP $HTTP_CODE)"
          echo "Download: ${URL}"
          # Set outputs for subsequent steps
          echo "package-url=${URL}" >> "${GITHUB_OUTPUT:-/dev/null}"
          echo "package-name=${PKG_NAME}" >> "${GITHUB_OUTPUT:-/dev/null}"
          echo "package-version=${VERSION}" >> "${GITHUB_OUTPUT:-/dev/null}"
        elif [ "$HTTP_CODE" = "409" ]; then
          echo "::warning::Package ${PKG_NAME}/${VERSION}/${FILENAME} already exists (HTTP 409)"
          echo "package-url=${URL}" >> "${GITHUB_OUTPUT:-/dev/null}"
        else
          echo "::error::Upload failed (HTTP $HTTP_CODE): $(cat /tmp/publish-response.txt)"
          exit 1
        fi
